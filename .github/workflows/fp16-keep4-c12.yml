name: FP16 keep4 case12 optimization

on:
  push:
    branches:
      - exp/vendor-fp16-throughput-c12-c14
    paths:
      - .github/workflows/fp16-keep4-c12.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: exp/vendor-fp16-throughput-c12-c14
          fetch-depth: 0

      - name: Apply keep4 patch
        run: |
          python3 tools/apply_fp16_keep4_c12.py
          git diff --check

      - name: Commit optimized production header
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm tools/apply_fp16_keep4_c12.py .github/workflows/fp16-keep4-c12.yml
          git add submission/dense_repeat_override.h
          git commit -m "perf: specialize fp16 k<=4 inner256 keep4 path"
          git push origin HEAD:exp/vendor-fp16-throughput-c12-c14
