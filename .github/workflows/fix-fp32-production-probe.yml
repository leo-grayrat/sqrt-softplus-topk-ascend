name: Fix FP32 production probe wrapper formatting

on:
  push:
    branches:
      - exp/vendor-largek-merge32-64
    paths:
      - .github/workflows/fix-fp32-production-probe.yml

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: exp/vendor-largek-merge32-64
          fetch-depth: 0
      - name: Replace escaped wrapper text with real source lines
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('debug/cpu_topk_probe/topk_fp32_vendor_production_probe.asc')
          text = path.read_text(encoding='utf-8')
          start = text.index('namespace {\\n\\n__global__')
          end_marker = '}\\n\\nbool CheckAcl'
          end = text.index(end_marker, start) + len('}\\n\\n')
          wrapper = '''namespace {

__global__ __vector__ void topk_fp32_vendor_production_probe_kernel(
    GM_ADDR routerLogits,
    GM_ADDR topkScores,
    int32_t rows,
    int32_t experts,
    int32_t inner,
    int32_t k,
    int32_t blockNum)
{
    AscendC::InitSocState();
    AscendC::tiling::TopkTiling dummyTiling{};
    RunVendorTopKDispatch(
        VendorDispatchTag<float>{},
        routerLogits,
        topkScores,
        rows,
        experts,
        inner,
        k,
        blockNum,
        1,
        0,
        dummyTiling);
    AscendC::PipeBarrier<PIPE_ALL>();
}

'''
          text = text[:start] + wrapper + text[end:]
          path.write_text(text, encoding='utf-8')
          PY
          grep -n '^namespace {$' debug/cpu_topk_probe/topk_fp32_vendor_production_probe.asc
          grep -n '^__global__ __vector__ void topk_fp32_vendor_production_probe_kernel' debug/cpu_topk_probe/topk_fp32_vendor_production_probe.asc
          git diff --check
      - name: Commit fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add debug/cpu_topk_probe/topk_fp32_vendor_production_probe.asc
          git commit -m "fix: format fp32 production probe wrapper"
          git push origin HEAD:exp/vendor-largek-merge32-64
