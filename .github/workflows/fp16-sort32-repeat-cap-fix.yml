name: FP16 Sort32 repeat cap fix

on:
  push:
    branches:
      - exp/vendor-fp16-throughput-c12-c14
    paths:
      - .github/workflows/fp16-sort32-repeat-cap-fix.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: exp/vendor-fp16-throughput-c12-c14
          fetch-depth: 0

      - name: Apply repeat cap patch
        run: |
          python3 tools/fp16_sort32_repeat_cap_fix.py
          git diff --check

      - name: Commit fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add submission/dense_repeat_override.h
          git commit -m "fix: cap FP16 vendor batches at Sort32 repeat limit"
          git push origin HEAD:exp/vendor-fp16-throughput-c12-c14
