name: Integrate validated large-k vendor paths

on:
  push:
    branches:
      - exp/vendor-largek-merge32-64
    paths:
      - .github/workflows/integrate-largek-production.yml

permissions:
  contents: write

jobs:
  integrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: exp/vendor-largek-merge32-64
          fetch-depth: 0

      - name: Integrate production paths and dispatch probes
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          root = Path('.')
          header_path = root / 'submission' / 'dense_repeat_override.h'
          fp16_probe_path = root / 'debug' / 'cpu_topk_probe' / 'topk_fp16_vendor_large_probe.asc'
          fp32_probe_path = root / 'debug' / 'cpu_topk_probe' / 'topk_fp32_vendor_large_probe.asc'
          prod_half_path = root / 'debug' / 'cpu_topk_probe' / 'topk_fp16_vendor_production_probe.asc'
          prod_float_path = root / 'debug' / 'cpu_topk_probe' / 'topk_fp32_vendor_production_probe.asc'
          cmake_path = root / 'debug' / 'cpu_topk_probe' / 'CMakeLists.txt'

          header = header_path.read_text(encoding='utf-8')
          fp16 = fp16_probe_path.read_text(encoding='utf-8')
          fp32 = fp32_probe_path.read_text(encoding='utf-8')

          if 'SqrtSoftplusVendorPerfTopKHalfLargeKernel' in header or 'SqrtSoftplusVendorPerfTopKFloatLargeKernel' in header:
              raise RuntimeError('large-k production classes already present')

          def extract_class(text: str, class_name: str, kernel_marker: str) -> str:
              start = text.index(f'class {class_name}')
              end = text.index(kernel_marker, start)
              return text[start:end]

          fp16_class = extract_class(
              fp16,
              'Fp16VendorLargeProbeKernel',
              '__global__ __vector__ void topk_fp16_vendor_large_probe_kernel')
          fp32_class = extract_class(
              fp32,
              'Fp32VendorLargeProbeKernel',
              '__global__ __vector__ void topk_fp32_vendor_large_probe_kernel')

          renames = {
              'LARGE_PAIR_FLOATS_64': 'VENDOR_LARGE_PAIR_FLOATS_64',
              'LARGE_PAIR_FLOATS_32': 'VENDOR_LARGE_PAIR_FLOATS_32',
              'LARGE_KEEP_K': 'VENDOR_LARGE_KEEP_K',
              'LARGE_SORT_K': 'VENDOR_LARGE_SORT_K',
          }
          for old, new in renames.items():
              fp16_class = fp16_class.replace(old, new)
              fp32_class = fp32_class.replace(old, new)

          fp16_class = fp16_class.replace(
              'Fp16VendorLargeProbeKernel',
              'SqrtSoftplusVendorPerfTopKHalfLargeKernel')
          fp32_class = fp32_class.replace(
              'Fp32VendorLargeProbeKernel',
              'SqrtSoftplusVendorPerfTopKFloatLargeKernel')

          constants = '''// Large-k vendor selection: Sort32 keeps all 32 values; later merge stages retain top-64.\nconstexpr int32_t VENDOR_LARGE_SORT_K = 32;\nconstexpr int32_t VENDOR_LARGE_KEEP_K = 64;\nconstexpr int32_t VENDOR_LARGE_PAIR_FLOATS_32 = VENDOR_LARGE_SORT_K * 2;\nconstexpr int32_t VENDOR_LARGE_PAIR_FLOATS_64 = VENDOR_LARGE_KEEP_K * 2;\n\n'''

          anchor = 'template <typename T>\nstruct VendorDispatchTag {};'
          if anchor not in header:
              raise RuntimeError('VendorDispatchTag anchor not found')
          header = header.replace(
              anchor,
              constants + fp32_class + '\n' + fp16_class + '\n' + anchor,
              1)

          half_overload = '''__aicore__ inline void RunVendorTopKDispatch(\n    VendorDispatchTag<half>,'''
          half_pos = header.find(half_overload)
          if half_pos < 0:
              raise RuntimeError('half dispatch overload not found')

          float_overload = '''__aicore__ inline void RunVendorTopKDispatch(\n    VendorDispatchTag<float>,\n    GM_ADDR routerLogits,\n    GM_ADDR topkScores,\n    int32_t rows,\n    int32_t experts,\n    int32_t inner,\n    int32_t k,\n    int32_t blockNum,\n    int32_t batchRows,\n    uint32_t topkTmpBytes,\n    const AscendC::tiling::TopkTiling& topkTiling)\n{\n    const bool useLarge32 = k == 32 && inner == 128;\n    const bool useLarge64 = k == 64 && inner == 1024;\n    if (useLarge32 || useLarge64) {\n        SqrtSoftplusVendorPerfTopKFloatLargeKernel op;\n        op.Init(routerLogits, topkScores, rows, experts, inner, k, blockNum);\n        op.Process();\n        return;\n    }\n\n    SqrtSoftplusTopKKernel<float> op;\n    op.Init(\n        routerLogits,\n        topkScores,\n        rows,\n        experts,\n        inner,\n        k,\n        blockNum,\n        batchRows,\n        topkTmpBytes,\n        topkTiling);\n    op.Process();\n}\n\n'''
          header = header[:half_pos] + float_overload + header[half_pos:]

          medium_branch = '''    if (k >= 9 && k <= 16 && inner <= 512) {\n        SqrtSoftplusVendorPerfTopKHalfMediumKernel op;\n        op.Init(routerLogits, topkScores, rows, experts, inner, k, blockNum);\n        op.Process();\n        return;\n    }\n\n'''
          if medium_branch not in header:
              raise RuntimeError('medium half branch anchor not found')
          large_half_branch = medium_branch + '''    if (k == 64 && inner == 256) {\n        SqrtSoftplusVendorPerfTopKHalfLargeKernel op;\n        op.Init(routerLogits, topkScores, rows, experts, inner, k, blockNum);\n        op.Process();\n        return;\n    }\n\n'''
          header = header.replace(medium_branch, large_half_branch, 1)
          header_path.write_text(header, encoding='utf-8')

          half_prod = prod_half_path.read_text(encoding='utf-8')
          half_case_anchor = '        {17, 512, 10, 8},\n'
          if half_case_anchor not in half_prod:
              raise RuntimeError('half production case anchor not found')
          half_prod = half_prod.replace(
              half_case_anchor,
              half_case_anchor + '        {17, 256, 64, 8},\n        {33, 241, 64, 8},\n',
              1)
          prod_half_path.write_text(half_prod, encoding='utf-8')

          namespace_marker = 'namespace {'
          ns_pos = fp32.index(namespace_marker) + len(namespace_marker)
          host_pos = fp32.index('bool CheckAcl(', ns_pos)
          prefix = fp32[:ns_pos]
          host = fp32[host_pos:]
          host = host.replace(
              'topk_fp32_vendor_large_probe_kernel<<<blockNum, nullptr, stream>>>(',
              'topk_fp32_vendor_production_probe_kernel<<<blockNum, nullptr, stream>>>(',
              1)
          wrapper = r'''\n\n__global__ __vector__ void topk_fp32_vendor_production_probe_kernel(\n    GM_ADDR routerLogits,\n    GM_ADDR topkScores,\n    int32_t rows,\n    int32_t experts,\n    int32_t inner,\n    int32_t k,\n    int32_t blockNum)\n{\n    AscendC::InitSocState();\n    AscendC::tiling::TopkTiling dummyTiling{};\n    RunVendorTopKDispatch(\n        VendorDispatchTag<float>{},\n        routerLogits,\n        topkScores,\n        rows,\n        experts,\n        inner,\n        k,\n        blockNum,\n        1,\n        0,\n        dummyTiling);\n    AscendC::PipeBarrier<PIPE_ALL>();\n}\n\n'''
          prod_float_path.write_text(prefix + wrapper + host, encoding='utf-8')

          cmake = cmake_path.read_text(encoding='utf-8')
          exe_anchor = '''add_executable(topk_fp16_vendor_production_probe\n    topk_fp16_vendor_production_probe.asc\n)\n'''
          if exe_anchor not in cmake:
              raise RuntimeError('CMake production probe anchor not found')
          cmake = cmake.replace(
              exe_anchor,
              exe_anchor + '''\nadd_executable(topk_fp32_vendor_production_probe\n    topk_fp32_vendor_production_probe.asc\n)\n''',
              1)
          list_anchor = '        topk_fp16_vendor_production_probe\n'
          cmake = cmake.replace(
              list_anchor,
              list_anchor + '        topk_fp32_vendor_production_probe\n',
              1)
          cmake_path.write_text(cmake, encoding='utf-8')
          PY

      - name: Sanity check generated source
        run: |
          grep -n "SqrtSoftplusVendorPerfTopKFloatLargeKernel" submission/dense_repeat_override.h
          grep -n "SqrtSoftplusVendorPerfTopKHalfLargeKernel" submission/dense_repeat_override.h
          grep -n "k == 32 && inner == 128" submission/dense_repeat_override.h
          grep -n "k == 64 && inner == 1024" submission/dense_repeat_override.h
          grep -n "k == 64 && inner == 256" submission/dense_repeat_override.h
          test -z "$(git diff --name-only -- submission/main.asc)"
          git diff --check

      - name: Commit production integration
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add submission/dense_repeat_override.h \
                  debug/cpu_topk_probe/CMakeLists.txt \
                  debug/cpu_topk_probe/topk_fp16_vendor_production_probe.asc \
                  debug/cpu_topk_probe/topk_fp32_vendor_production_probe.asc
          git commit -m "feat: integrate validated large-k vendor paths"
          git push origin HEAD:exp/vendor-largek-merge32-64
