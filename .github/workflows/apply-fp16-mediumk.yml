name: Apply FP16 medium-k production integration

on:
  push:
    branches:
      - exp/fp16-vendor-mediumk-keep16
    paths:
      - .github/workflows/apply-fp16-mediumk.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: exp/fp16-vendor-mediumk-keep16
          fetch-depth: 0
      - name: Apply tested keep-16 implementation
        run: python3 tools/apply_fp16_vendor_mediumk.py
      - name: Commit generated production header
        run: |
          if git diff --quiet -- submission/dense_repeat_override.h; then
            echo "No production diff to commit"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add submission/dense_repeat_override.h
          git commit -m "feat: integrate fp16 medium-k keep16 vendor path"
          git push origin HEAD:exp/fp16-vendor-mediumk-keep16
