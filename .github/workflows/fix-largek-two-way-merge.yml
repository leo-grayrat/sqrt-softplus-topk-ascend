name: Fix large-k two-way merge probe

on:
  push:
    branches:
      - exp/vendor-largek-merge32-64
    paths:
      - .github/workflows/fix-largek-two-way-merge.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: exp/vendor-largek-merge32-64
          fetch-depth: 0
      - name: Patch invalid multi-row validBit=3 merge
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          paths = [
              Path('debug/cpu_topk_probe/topk_fp16_vendor_large_probe.asc'),
              Path('debug/cpu_topk_probe/topk_fp32_vendor_large_probe.asc'),
          ]

          replacement = r'''    __aicore__ inline void MergeTwo64(
              const AscendC::LocalTensor<float>& dst,
              const AscendC::LocalTensor<float>& src,
              int32_t rows)
          {
              AscendC::MrgSort4Info params;
              params.elementLengths[0] = LARGE_KEEP_K;
              params.elementLengths[1] = LARGE_KEEP_K;
              params.elementLengths[2] = 0;
              params.elementLengths[3] = 0;
              params.ifExhaustedSuspension = false;
              params.validBit = 3;
              params.repeatTimes = 1;

              constexpr int32_t rowFloats = 2 * LARGE_PAIR_FLOATS_64;
              for (int32_t row = 0; row < rows; ++row) {
                  const uint32_t rowBase = static_cast<uint32_t>(row * rowFloats);
                  AscendC::MrgSortSrcList<float> srcList;
                  srcList.src1 = src[rowBase];
                  srcList.src2 = src[rowBase + LARGE_PAIR_FLOATS_64];
                  srcList.src3 = src[rowBase];
                  srcList.src4 = src[rowBase];
                  AscendC::MrgSort<float>(dst[rowBase], srcList, params);
              }
              AscendC::PipeBarrier<PIPE_V>();
          }

          __aicore__ inline void CopyPrefixPairs'''

          pattern = re.compile(
              r'    __aicore__ inline void MergeTwo64\(.*?\n'
              r'    __aicore__ inline void CopyPrefixPairs',
              re.S,
          )

          for path in paths:
              text = path.read_text(encoding='utf-8')
              new_text, count = pattern.subn(replacement, text, count=1)
              if count != 1:
                  raise RuntimeError(f'{path}: MergeTwo64 replacement count={count}')
              path.write_text(new_text, encoding='utf-8')
          PY
      - name: Commit probe fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add debug/cpu_topk_probe/topk_fp16_vendor_large_probe.asc debug/cpu_topk_probe/topk_fp32_vendor_large_probe.asc
          git commit -m "fix: merge large-k two-list rows explicitly"
          git push origin HEAD:exp/vendor-largek-merge32-64
