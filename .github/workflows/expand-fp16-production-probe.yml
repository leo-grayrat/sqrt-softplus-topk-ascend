name: Expand FP16 production probe batches

on:
  push:
    branches:
      - exp/vendor-fp16-throughput-c12-c14
    paths:
      - .github/workflows/expand-fp16-production-probe.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: exp/vendor-fp16-throughput-c12-c14
          fetch-depth: 0

      - name: Expand production probe batch cases
        run: |
          python3 tools/expand_fp16_production_probe_batches.py
          git diff --check

      - name: Commit probe update
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm tools/expand_fp16_production_probe_batches.py .github/workflows/expand-fp16-production-probe.yml
          git add debug/cpu_topk_probe/topk_fp16_vendor_production_probe.asc
          git commit -m "test: cover max fp16 vendor batch rows"
          git push origin HEAD:exp/vendor-fp16-throughput-c12-c14
