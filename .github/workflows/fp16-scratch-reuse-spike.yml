name: FP16 scratch reuse throughput spike

on:
  push:
    branches:
      - exp/vendor-fp16-throughput-c12-c14
    paths:
      - .github/workflows/fp16-scratch-reuse-spike.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: exp/vendor-fp16-throughput-c12-c14
          fetch-depth: 0

      - name: Apply scratch-reuse spike
        run: |
          python3 tools/fp16_scratch_reuse_spike.py
          git diff --check
          grep -n "SelectVendorHalfScratchBatchRows" submission/dense_repeat_override.h

      - name: Commit spike
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add submission/dense_repeat_override.h
          git commit -m "perf: reuse FP16 sort scratch and double batch rows"
          git push origin HEAD:exp/vendor-fp16-throughput-c12-c14
